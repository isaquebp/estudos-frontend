<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>
    <main>
        <section>
            <div id="inputs">
                Inicio <input type="number" name="" id="iniciotxt" class="numero"><br>
                Fim: <input type="number" name="" id="fimtxt" class="numero"><br>
                Passo: <input type="number" name="" id="passotxt" class="numero"><br>
                <input type="button" value="Contar" class="numero" onclick="contar()">
            </div>
            <div id="msg">
                Preparando a contagem...
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; Curso em video</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
